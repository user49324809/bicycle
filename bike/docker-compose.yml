version: '3.8'

services:
  web:
    build: .
    container_name: bike
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
  db: 
    image: mysql
    container_name: bike_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bike_db
    ports:
      - "3307:3306"
    