services:
  web:
    build:
      context: .
      dockerfile: bike/dockerfile
    container_name: bike
    ports:
      - "8080:80"
    volumes:
      - ./bike:/var/www/html
  web_admin:
    build:
      context: .
      dockerfile: admin/dockerfile
    container_name: admin
    ports:
      - "8090:80"
    volumes:
      - ./admin:/var/www/html
  db: 
    image: mysql
    container_name: bike_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=bike_db
    ports:
      - "3307:3306"